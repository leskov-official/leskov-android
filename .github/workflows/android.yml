name: LESKOV Android — build, test and APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: leskov-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 36
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Static source validation
        run: python3 tools/validate_source.py

      - name: Configure optional REAL Firebase project
        shell: bash
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [[ -n "$FIREBASE_ANDROID_CONFIG_BASE64" ]]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > app/google-services.json
            python3 tools/validate_source.py
          else
            echo 'FCM unavailable: no real Firebase configuration supplied.'
          fi

      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK for device testing
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LESKOV-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Upload test and lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LESKOV-build-diagnostics
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
