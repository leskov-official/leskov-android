name: LESKOV Android — test, APK and Play bundle

on:
  workflow_dispatch:
    inputs:
      sign_for_play:
        description: Sign the release bundle with the configured upload key
        type: boolean
        default: false
  push:
    branches: [main, "release/play-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: leskov-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform 36
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Static source validation
        run: python3 tools/validate_source.py

      - name: Test website audio integration
        run: |
          node tools/test_player_bridge.js
          node tools/test_app_shell.js

      - name: Test protected mobile track API
        run: python3 tools/test_mobile_backend.py

      - name: Configure Firebase project
        shell: bash
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [[ -n "$FIREBASE_ANDROID_CONFIG_BASE64" ]]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > app/google-services.json
            python3 tools/validate_source.py
          else
            echo 'Missing FIREBASE_ANDROID_CONFIG_BASE64: refusing to build an APK without notifications.'
            exit 1
          fi

      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK for device testing
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LESKOV-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Android lint
        if: always()
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Build release candidate
        if: success() && !inputs.sign_for_play
        run: ./gradlew --no-daemon :app:bundleRelease :app:lintRelease

      - name: Build and verify signed Play bundle
        if: success() && github.event_name == 'workflow_dispatch' && inputs.sign_for_play
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${UPLOAD_KEYSTORE_BASE64:?Missing upload keystore}" "${KEY_ALIAS:?Missing alias}" "${STORE_PASSWORD:?Missing store password}" "${KEY_PASSWORD:?Missing key password}"
          export KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          umask 077
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          unset UPLOAD_KEYSTORE_BASE64
          ./gradlew --no-daemon --no-configuration-cache :app:bundleRelease :app:lintRelease
          bundle=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$bundle"
          keytool -exportcert -alias "$KEY_ALIAS" -keystore "$KEYSTORE_PATH" -storepass:env STORE_PASSWORD > "$RUNNER_TEMP/upload-cert.der"
          keytool -printcert -rfc -jarfile "$bundle" | openssl x509 -outform der | cmp - "$RUNNER_TEMP/upload-cert.der"

      - name: Upload release bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LESKOV-Android-${{ inputs.sign_for_play && 'Play-signed' || 'unsigned-candidate' }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LESKOV-build-diagnostics
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
